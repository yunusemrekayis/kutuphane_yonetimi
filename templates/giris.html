{% extends "base.html" %}

{% block baslik %}Giriş Yap - Kütüphane Yönetim Sistemi{% endblock %}

{% block icerik %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card form-karti shadow-sm p-4 p-md-5 border-0">
            <div class="text-center mb-4">
                <div class="stat-ikon-kutusu stat-ikon-mavi mx-auto mb-3">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h2 class="fw-bold">🔐 Üye Girişi</h2>
                <p class="text-muted small">Kütüphane sistemine erişmek için lütfen giriş yapınız.</p>
            </div>

            {% if hata %}
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div>
                    <strong>⚠️ Hata:</strong> {{ hata }}
                </div>
            </div>
            {% endif %}

            <form action="{{ url_for('giris') }}" method="POST" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-posta Adresi <span class="zorunlu">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="ornek@okul.k12.tr" 
                            required
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <label for="sifre" class="form-label">
                        Şifre <span class="zorunlu">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input 
                            type="password" 
                            id="sifre" 
                            name="sifre" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success btn-lg fw-semibold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
                    </button>
                </div>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Henüz hesabınız yok mu? 
                        <a href="{{ url_for('kayit') }}" class="text-primary fw-semibold text-decoration-none">
                            Hemen Kayıt Olun
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
