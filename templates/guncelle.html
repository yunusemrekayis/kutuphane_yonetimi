{% extends "base.html" %}

{% block baslik %}Üye Güncelle - Kütüphane Yönetim Sistemi{% endblock %}

{% block icerik %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card form-karti shadow-sm p-4 p-md-5 border-0">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="stat-ikon-kutusu stat-ikon-mavi">
                    <i class="bi bi-person-gear"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-0">✏️ Üye Bilgilerini Güncelle</h2>
                    <p class="text-muted small mb-0">Lütfen güncel bilgileri giriniz.</p>
                </div>
            </div>

            {% if hata %}
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div>
                    <strong>⚠️ Uyarı:</strong> {{ hata }}
                </div>
            </div>
            {% endif %}

            <form action="{{ url_for('uye_guncelle', id=uye.id) }}" method="POST" novalidate>
                <div class="mb-3">
                    <label for="isim" class="form-label">
                        İsim <span class="zorunlu">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="isim" 
                        name="isim" 
                        class="form-control" 
                        placeholder="Adınızı giriniz" 
                        value="{{ form_verisi.get('isim', uye.isim) }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-posta <span class="zorunlu">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="ornek@okul.k12.tr" 
                        value="{{ form_verisi.get('email', uye.email) }}"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="telefon" class="form-label">Telefon (Opsiyonel)</label>
                    <input 
                        type="tel" 
                        id="telefon" 
                        name="telefon" 
                        class="form-control" 
                        placeholder="05XX XXX XX XX" 
                        value="{{ form_verisi.get('telefon', uye.telefon if uye.telefon else '') }}"
                    >
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 pt-2">
                    <button type="submit" class="btn btn-success btn-lg fw-semibold flex-grow-1 shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Bilgileri Güncelle
                    </button>
                    <a href="{{ url_for('admin') if session.get('rol') == 'admin' else url_for('uyeler') }}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left me-1"></i> Geri Dön
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
