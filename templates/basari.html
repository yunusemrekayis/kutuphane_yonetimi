{% extends "base.html" %}

{% block baslik %}Kayıt Başarılı - Kütüphane Yönetim Sistemi{% endblock %}

{% block icerik %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card form-karti shadow-sm p-4 p-md-5 border-0 text-center">
            <div class="stat-ikon-kutusu stat-ikon-yesil mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            
            <h2 class="fw-bold mb-2">Tebrikler, kaydoldunuz!</h2>
            <p class="text-muted mb-4">Kütüphane üyelik kaydınız başarıyla tamamlandı.</p>

            <div class="d-grid gap-2">
                <a href="{{ url_for('giris') }}" class="btn btn-success btn-lg fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
                </a>
                <a href="{{ url_for('uyeler') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-people me-1"></i> Üyeleri Görüntüle
                </a>
                <a href="{{ url_for('kayit') }}" class="btn btn-outline-primary">
                    <i class="bi bi-person-plus me-1"></i> Yeni Üye Kaydet
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
