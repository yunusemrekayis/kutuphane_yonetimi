{% extends "base.html" %}

{% block baslik %}{{ kitap.ad }} - Kitap Güncelle{% endblock %}

{% block icerik %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card form-karti shadow-sm p-4 p-md-5 border-0">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="stat-ikon-kutusu stat-ikon-mavi">
                    <i class="bi bi-pencil-square"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-0">✏️ Kitap Bilgilerini Güncelle</h2>
                    <p class="text-muted small mb-0">
                        "<strong>{{ kitap.ad }}</strong>" adlı eserin verilerini güncelleyebilirsiniz.
                    </p>
                </div>
            </div>

            {% if hata %}
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div>
                    <strong>⚠️ Hata:</strong> {{ hata }}
                </div>
            </div>
            {% endif %}

            <form action="{{ url_for('kitap_guncelle', id=kitap.id) }}" method="POST" novalidate>
                <div class="mb-3">
                    <label for="ad" class="form-label">
                        Kitap Adı <span class="zorunlu">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="ad" 
                        name="ad" 
                        class="form-control" 
                        value="{{ form_verisi.get('ad', kitap.ad) }}" 
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="yazar" class="form-label">
                        Yazar <span class="zorunlu">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="yazar" 
                        name="yazar" 
                        class="form-control" 
                        value="{{ form_verisi.get('yazar', kitap.yazar) }}" 
                        required
                    >
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="yil" class="form-label">Basım Yılı</label>
                        <input 
                            type="number" 
                            id="yil" 
                            name="yil" 
                            class="form-control" 
                            min="1000" 
                            max="2099" 
                            value="{{ form_verisi.get('yil', kitap.yil if kitap.yil else '') }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="kategori" class="form-label">Kategori</label>
                        <input 
                            type="text" 
                            id="kategori" 
                            name="kategori" 
                            class="form-control" 
                            value="{{ form_verisi.get('kategori', kitap.kategori if kitap.kategori else '') }}"
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <label for="kopya_sayisi" class="form-label">Kopya / Adet Sayısı</label>
                    <input 
                        type="number" 
                        id="kopya_sayisi" 
                        name="kopya_sayisi" 
                        class="form-control" 
                        min="1" 
                        value="{{ form_verisi.get('kopya_sayisi', kitap.kopya_sayisi) }}"
                    >
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 pt-2">
                    <button type="submit" class="btn btn-success btn-lg fw-semibold flex-grow-1 shadow-sm">
                        <i class="bi bi-save me-1"></i> Değişiklikleri Kaydet
                    </button>
                    <a href="{{ url_for('kitap_detay', id=kitap.id) }}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-arrow-left me-1"></i> Detaya Dön
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
